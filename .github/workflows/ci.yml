name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: npm run check
      - name: Unit tests
        run: npm test

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t krishivision:ci .
      - name: Smoke test container
        run: |
          docker run -d --name kv -p 8080:80 krishivision:ci
          sleep 3
          curl -fsS http://localhost:8080/ | grep -q "KrishiVision"
